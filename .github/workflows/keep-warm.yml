name: Keep HF Space warm

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
  workflow_dispatch:          # manual trigger from Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping inference API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://YOUR-HF-SPACE.hf.space/)
          echo "HF Space responded with HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: unexpected status $STATUS"
          fi
